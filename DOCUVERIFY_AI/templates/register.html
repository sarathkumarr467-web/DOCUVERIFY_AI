<!DOCTYPE html>
<html>

<head>

    <title>Register - DOCUVERIFY AI</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eff6ff,
                    #dbeafe
                );
        }

        .card {

            width: 420px;

            background: white;

            padding: 40px;

            border-radius: 18px;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.10);
        }

        .logo {

            text-align: center;

            font-size: 45px;
        }

        h1 {

            text-align: center;

            color: #111827;

            margin-bottom: 8px;
        }

        .subtitle {

            text-align: center;

            color: #6b7280;

            margin-bottom: 28px;
        }

        label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;
        }

        input {

            width: 100%;

            padding: 13px;

            margin-bottom: 18px;

            border: 1px solid #d1d5db;

            border-radius: 9px;

            font-size: 15px;
        }

        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #16a34a;

            color: white;

            font-weight: bold;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {

            background: #15803d;
        }

        .login {

            text-align: center;

            margin-top: 20px;

            color: #6b7280;
        }

        .login a {

            color: #2563eb;

            font-weight: bold;

            text-decoration: none;
        }

        .message {

            background: #fee2e2;

            color: #991b1b;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 18px;
        }

    </style>

</head>


<body>


<div class="card">

    <div class="logo">
        🛡️
    </div>

    <h1>
        Create Account
    </h1>

    <div class="subtitle">
        Join DOCUVERIFY AI
    </div>


    {% with messages =
        get_flashed_messages(with_categories=true)
    %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <form
        method="POST"
        action="{{ url_for('register') }}"
    >

        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            placeholder="Create username"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Create password"
            minlength="6"
            required
        >


        <label>
            Confirm Password
        </label>

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm password"
            minlength="6"
            required
        >


        <button type="submit">
            ✅ Create Account
        </button>

    </form>


    <div class="login">

        Already have an account?

        <a href="{{ url_for('login') }}">
            Login
        </a>

    </div>

</div>


</body>

</html>
